name: ci

on:
  push:
  pull_request:

# Every job installs Hermes the same way: its exact pinned dependencies and uv overrides (minus the Python 3.14
# marker, see .github/scripts/hermes_requirements.py), then the checkout itself without dependencies.
jobs:
  test:
    name: test (hermes ${{ matrix.hermes }}, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v0.22.7 is requires_hermes, v0.23.0 the newest release, main what comes next.
        hermes: [v0.22.7, v0.23.0, main]
        # 3.14 is Hermes' runtime; 3.11 and 3.13 run the same pins on older interpreters.
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: tallyhand
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Hermes
        run: |
          python -m pip install --quiet uv
          python -m uv venv --python "$(command -v python)" "$RUNNER_TEMP/venv"
          python tallyhand/.github/scripts/hermes_requirements.py hermes-agent "$RUNNER_TEMP/req.txt" "$RUNNER_TEMP/ovr.txt"
          venv="$RUNNER_TEMP/venv/bin/python"
          python -m uv pip install --python "$venv" -r "$RUNNER_TEMP/req.txt" --override "$RUNNER_TEMP/ovr.txt"
          python -m uv pip install --python "$venv" --no-deps -e ./hermes-agent
          python -m uv pip install --python "$venv" pytest pytest-asyncio pytest-timeout
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Tests
        working-directory: tallyhand
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests -q

  plugin-checks:
    name: doctor and validate (hermes ${{ matrix.hermes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes: [v0.22.7, v0.23.0, main]
    steps:
      - uses: actions/checkout@v7
        with:
          path: tallyhand
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Hermes
        run: |
          python -m pip install --quiet uv
          python -m uv venv --python "$(command -v python)" "$RUNNER_TEMP/venv"
          python tallyhand/.github/scripts/hermes_requirements.py hermes-agent "$RUNNER_TEMP/req.txt" "$RUNNER_TEMP/ovr.txt"
          venv="$RUNNER_TEMP/venv/bin/python"
          python -m uv pip install --python "$venv" -r "$RUNNER_TEMP/req.txt" --override "$RUNNER_TEMP/ovr.txt"
          python -m uv pip install --python "$venv" --no-deps -e ./hermes-agent
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Plugin doctor (no errors, no warnings)
        working-directory: tallyhand
        run: |
          hermes plugins doctor . --ci | tee "$RUNNER_TEMP/doctor.txt"
          ! grep -E "^\s*(WARN|ERROR):" "$RUNNER_TEMP/doctor.txt"
      - name: Plugin validate (no errors, no warnings)
        working-directory: tallyhand
        run: |
          hermes plugins validate . --install-deps
          hermes plugins validate . --json > "$RUNNER_TEMP/validate.json"
          python -c "import json, sys; d = json.load(open(sys.argv[1])); print(d['warnings']); sys.exit(0 if d['ok'] and not d['warnings'] else 1)" "$RUNNER_TEMP/validate.json"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3
      - run: ruff check .
